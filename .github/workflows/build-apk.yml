name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          F=$(find . -name capacitor.config.ts -not -path '*/node_modules/*' | head -1)
          if [ -z "$F" ]; then echo "capacitor.config.ts not found - files missing from upload"; find . -maxdepth 3 -not -path './.git/*' | head -50; exit 1; fi
          echo "APP_DIR=$(dirname "$F")" >> $GITHUB_ENV
          echo "Project is in: $(dirname "$F")"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --no-frozen-lockfile

      - name: Build web app and sync into Android project
        working-directory: ${{ env.APP_DIR }}
        run: pnpm sync

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" PersExp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PersExp-apk
          path: PersExp.apk

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PersExp (latest build)
          files: PersExp.apk
